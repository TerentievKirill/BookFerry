name: Allure Report

on:
  workflow_dispatch:

jobs:
  allure-report:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: test-token
      API_BASE_URL: https://api.heartlab.app
      TEST_TELEGRAM_ID: "0"

    steps:
      - name: Checkout BookFerry
        uses: actions/checkout@v6
        with:
          path: backend

      - name: Checkout BookFerryBot
        uses: actions/checkout@v6
        with:
          repository: TerentievKirill/BookFerryBot
          path: bot

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            bot/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r bot/requirements.txt

      - name: Install Allure 3
        run: npm install --no-save allure@3.14.3

      - name: Build BookFerry
        run: docker build -t bookferry-test ./backend

      - name: Start BookFerry
        run: |
          docker run -d \
            --name bookferry-test \
            -p 8000:8000 \
            -e DB_NAME=/app/tests/data/bookferry_test.db \
            -e CATALOG_DB_NAME=/app/tests/data/catalog_test.db \
            bookferry-test

          sleep 2

      - name: Run all tests
        shell: bash
        run: |
          set +e

          cd "$GITHUB_WORKSPACE/backend"
          pytest tests -v -s -m "not e2e" \
            --alluredir="$GITHUB_WORKSPACE/allure-results"
          BACKEND_SMOKE=$?

          pytest tests/test_external_e2e.py -v -s -m e2e \
            --alluredir="$GITHUB_WORKSPACE/allure-results"
          BACKEND_E2E=$?

          cd "$GITHUB_WORKSPACE/bot"
          pytest tests/test_external_e2e.py -v -s -m e2e \
            --alluredir="$GITHUB_WORKSPACE/allure-results"
          BOT_E2E=$?

          echo "Backend smoke: $BACKEND_SMOKE"
          echo "Backend E2E:   $BACKEND_E2E"
          echo "Bot E2E:       $BOT_E2E"

          if [ "$BACKEND_SMOKE" -ne 0 ] || [ "$BACKEND_E2E" -ne 0 ] || [ "$BOT_E2E" -ne 0 ]; then
            exit 1
          fi

      - name: Publish Allure report
        if: always()
        env:
          ALLURE_TOKEN: ${{ secrets.ALLURE_TOKEN }}
        run: |
          cat > allurerc.mjs <<'EOF'
          import { defineConfig } from "allure";

          export default defineConfig({
            name: "BookFerry",
            plugins: {
              awesome: {
                options: {
                  publish: true,
                },
              },
            },
            allureService: {
              accessToken: process.env.ALLURE_TOKEN,
            },
          });
          EOF

          npx allure generate allure-results

      - name: Upload combined Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookferry-allure-results
          path: allure-results
          retention-days: 30

      - name: Show container logs on failure
        if: failure()
        run: docker logs bookferry-test
