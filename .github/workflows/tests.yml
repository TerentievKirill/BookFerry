name: Tests

on:
  push:
    branches:
      - main
      - testing
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build BookFerry
        run: docker build -t bookferry-test .

      - name: Start BookFerry
        run: |
          docker run -d \
            --name bookferry-test \
            -p 8000:8000 \
            -e DB_NAME=/app/tests/data/bookferry_test.db \
            -e CATALOG_DB_NAME=/app/tests/data/bookferry_test.db \
            bookferry-test

      - name: Wait for BookFerry
        run: |
          curl \
            --fail \
            --retry 20 \
            --retry-delay 1 \
            --retry-connrefused \
            http://127.0.0.1:8000/health

      - name: Run tests
        run: pytest tests -v

      - name: Show container logs on failure
        if: failure()
        run: docker logs bookferry-test